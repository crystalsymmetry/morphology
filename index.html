<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 32 Crystal Classes in 3D</title>
<meta name="description" content="Interactive 3D models of typical crystal habits for all 32 crystallographic point groups – switchable symmetry elements, animated symmetry operations, live stereograms, quiz mode. In English, German, French and Spanish.">
<meta property="og:type" content="website">
<meta property="og:title" content="The 32 Crystal Classes in 3D">
<meta property="og:description" content="Real crystal habits for all 32 point groups – rotatable 3D models with symmetry elements, stereograms and a quiz.">
<meta property="og:url" content="https://crystalsymmetry.github.io/morphology/">
<meta property="og:image" content="https://crystalsymmetry.github.io/morphology/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="author" content="Frank Hoffmann">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,500;1,600&family=IBM+Plex+Serif:ital,wght@0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4f2ec; --card:#fffdf8; --ink:#1d2433; --ink2:#4a5263; --ink3:#8a909c; --line:#dcd8cd;
  --accent:#2f5fb3; --mark:#ffcc33;
  --c2:#2f6fde; --c3:#1f9d55; --c4:#d6453d; --c6:#8e44c9; --cm:#e8960c; --ci:#222;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,sans-serif}
button{font:inherit;color:inherit}
.ob{ text-decoration:none; position:relative; display:inline-block }
.ob::before{content:"";position:absolute;left:8%;right:8%;top:.08em;border-top:1.5px solid currentColor}
.mono{font-family:"IBM Plex Mono",monospace}

header{padding:22px 28px 6px;display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap}
header h1{margin:0;font:500 26px/1.1 "IBM Plex Serif",serif;letter-spacing:-.01em}
header p{margin:4px 0 0;color:var(--ink2);font:italic 15px "IBM Plex Serif",serif}
header .spacer{flex:1}
.ghost{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--ink2);font-size:13px}
.ghost:hover{background:#fff;color:var(--ink)}

/* ---------- Galerie ---------- */
#gallery{padding:8px 20px 6px}
.systems{display:flex;flex-wrap:wrap;gap:10px}
.sysbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 8px 6px;flex:0 1 auto;max-width:100%;min-width:0}
.sysbox h3{margin:0 4px 6px;font:600 11px/1 "IBM Plex Sans";letter-spacing:.08em;text-transform:uppercase;color:var(--sys)}
.cards{display:flex;gap:4px;flex-wrap:wrap}
#gallery.collapsed .cards{flex-wrap:nowrap}
#gallery.collapsed .sysbox{flex:0 0 auto;max-width:none}
.card{width:84px;border:1px solid transparent;background:transparent;border-radius:9px;padding:4px 2px 5px;cursor:pointer;text-align:center;transition:background .15s,border-color .15s}
.card:hover{background:#f3f0e8}
.card.active{background:#fff;border-color:var(--sys);box-shadow:0 0 0 2px color-mix(in srgb,var(--sys) 25%,transparent)}
.card svg{display:block;margin:0 auto;width:62px;height:62px}
.card .hm{font:500 15px/1.2 "IBM Plex Serif",serif;margin-top:2px}
.card .mn{font-size:10.5px;line-height:1.2;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gallery.collapsed .systems{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px}
#gallery.collapsed .card .mn{display:none}
#gallery.collapsed .card svg{width:48px;height:48px}
#gallery.collapsed .card{width:64px}

/* ---------- Bühne ---------- */
#stage{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;padding:10px 20px 24px;align-items:start}
.viewer{position:sticky;top:10px}
@media (max-width:1000px){.viewer{position:static}}
@media (max-width:700px){.canvaswrap{height:min(78vh,115vw);min-height:360px}header{padding:16px 16px 4px}#gallery{padding:8px 10px 6px}#stage{padding:10px 10px 20px}}
@media (max-width:1000px){#stage{grid-template-columns:1fr}}
.viewer{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-height:560px}
.toolbar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.tgroup{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.tlabel{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-right:2px}
.tb{border:1px solid var(--line);background:#fff;border-radius:7px;padding:4px 9px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tb:hover{border-color:#b9b4a6}
.tb.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tb .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.tb:disabled{opacity:.35;cursor:default}
.tb.on:disabled{background:#fff;color:var(--ink);border-color:var(--line)}
.slider{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
.slider input{width:90px;accent-color:var(--ink)}
.canvaswrap{position:relative;flex:none;min-height:480px;height:calc(100vh - 120px);max-height:820px;background:radial-gradient(ellipse at 50% 38%,#fdfcf9 0%,#f1eee6 60%,#e6e2d7 100%);touch-action:none}
.canvaswrap canvas{display:block;width:100%;height:100%;cursor:grab}
.canvaswrap canvas:active{cursor:grabbing}
.hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--ink3);pointer-events:none}
.bigsym{position:absolute;left:16px;top:12px;pointer-events:none}
.bigsym .s{font:500 34px/1 "IBM Plex Serif",serif}
.bigsym .n{font-size:13px;color:var(--ink2);margin-top:4px}
.viewbtns{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.viewbtns .tb{justify-content:center;font-size:12px;padding:3px 8px;background:rgba(255,255,255,.85)}
#tip{position:absolute;pointer-events:none;background:rgba(29,36,51,.92);color:#fff;padding:5px 9px;border-radius:7px;font-size:12.5px;display:none;white-space:nowrap;transform:translate(12px,12px)}
#opmsg{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:6px 14px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none}
#opmsg.show{opacity:.92}

/* ---------- Info ---------- */
aside{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.panel h2{margin:0 0 2px;font:500 22px/1.2 "IBM Plex Serif",serif}
.panel h4{margin:0 0 8px;font:600 11px/1 "IBM Plex Sans";letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;margin-top:10px}
.kv dt{color:var(--ink3)} .kv dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.chip{font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink2)}
.chip.yes{background:#eef3fb;border-color:#c9d7ef;color:#25467f}
.ex{font-size:13px;color:var(--ink2);margin-top:6px}
.ex b{color:var(--ink);font-weight:600}
table.forms{width:100%;border-collapse:collapse;font-size:13px}
table.forms td{padding:4px 4px;border-top:1px solid #eeeae0;vertical-align:middle}
table.forms tr:first-child td{border-top:none}
table.forms tr.hl td{background:#fff6d6}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.2)}
.elist{display:flex;flex-direction:column;gap:2px}
.erow{display:grid;grid-template-columns:22px 34px 1fr auto auto;align-items:center;gap:6px;padding:4px 2px;border-top:1px solid #eeeae0;font-size:13px}
.erow:first-child{border-top:none}
.erow input{margin:0;accent-color:var(--ink)}
.erow .glyph{width:30px;height:22px}
.erow .ib{border:1px solid var(--line);background:#fff;border-radius:6px;padding:2px 7px;cursor:pointer;font-size:12px}
.erow .ib:hover{border-color:#b9b4a6}
.muted{color:var(--ink3);font-size:12px}

.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.langs button{border:none;background:transparent;padding:5px 10px;cursor:pointer;font-size:12.5px;color:var(--ink2);letter-spacing:.04em}
.langs button.on{background:var(--ink);color:#fff}
.ghost.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.phead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:4px 10px}
.phead h4,.follow{white-space:nowrap}
.phead h4{margin:0}
.follow{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:5px;cursor:pointer}
.follow input{accent-color:var(--ink);margin:0}
#stereo{width:100%;aspect-ratio:1;display:block;margin:2px 0 6px;user-select:none}
#stereo .pole{cursor:pointer}
[hidden]{display:none!important}
#pQuiz h2{margin-bottom:6px}
.qgrid{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.qrow{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.qrow .qs{width:100%;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--sys)}
.qb{border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 0;width:52px;cursor:pointer;font:500 14px "IBM Plex Serif",serif}
.qb:hover{border-color:var(--sys)}
.qb.wrong{background:#fbe3e1;border-color:#e0a49e;color:#9b3a30}
.qb.right{background:#dff3e6;border-color:#8cc9a2;color:#1f6b3d}
.qfb{min-height:22px;margin-top:10px;font-size:13.5px}
.qfb.ok{color:#1f6b3d;font-weight:600}.qfb.no{color:#9b3a30}
.qact{display:flex;gap:6px;margin-top:10px;align-items:center}
.qact .tb.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.qscore{margin-left:auto;font-size:12px;color:var(--ink3)}
body.quiz #gallery{display:none}
#ftip{position:fixed;z-index:50;max-width:330px;background:var(--ink);color:#f4f2ec;border-radius:10px;padding:10px 13px;font-size:13px;line-height:1.45;box-shadow:0 8px 24px rgba(0,0,0,.18);pointer-events:none;display:none}
#ftip b{color:#fff}
#ftip .k{color:#aab3c5;font-size:12px;margin-top:6px}
table.forms tr{cursor:help}
.qhelp{width:18px;height:18px;border-radius:50%;border:1px solid var(--ink3);background:#fff;color:var(--ink2);font:600 11px/1 "IBM Plex Sans";cursor:pointer;padding:0;letter-spacing:0;text-transform:none}
.qhelp.on,.qhelp:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.helpbox{background:#f6f3ea;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:4px 0 10px;font-size:12.5px;line-height:1.5;color:var(--ink2)}
.helpbox b{color:var(--ink)}
.helpbox svg{width:100%;display:block;margin:4px 0 6px}
.helpbox ol{margin:4px 0 6px;padding-left:18px}
.helpbox li{margin:2px 0}
footer{padding:0 24px 26px;color:var(--ink3);font-size:12px;max-width:1100px}
</style>
</head>
<body>
<header>
  <div>
    <h1 data-i18n="title"></h1>
    <p data-i18n="subtitle"></p>
  </div>
  <div class="spacer"></div>
  <div class="langs" id="langs"></div>
  <button class="ghost" id="quizBtn" data-i18n="quiz"></button>
  <button class="ghost" id="collapseBtn"></button>
</header>

<section id="gallery"><div class="systems" id="systems"></div></section>

<section id="stage">
  <div class="viewer">
    <div class="toolbar">
      <div class="tgroup"><span class="tlabel" data-i18n="sym"></span>
        <button class="tb" data-kind="all"><span data-i18n="all"></span></button>
        <button class="tb" data-kind="rot"><span class="dot" style="background:var(--c4)"></span><span data-i18n="rot"></span></button>
        <button class="tb" data-kind="rotoinv"><span class="dot" style="background:#fff;border:2px solid var(--c4)"></span><span data-i18n="rotoinv"></span></button>
        <button class="tb" data-kind="mirror"><span class="dot" style="background:var(--cm)"></span><span data-i18n="mirror"></span></button>
        <button class="tb" data-kind="inv"><span class="dot" style="background:var(--ci)"></span><span data-i18n="inv"></span></button>
        <button class="tb on" id="tLabels" data-i18n="labelsEl" style="margin-left:6px"></button>
      </div>
      <div class="tgroup"><span class="tlabel" data-i18n="view"></span>
        <button class="tb" id="tForms" data-i18n="forms"></button>
        <button class="tb" id="tAxes" data-i18n="axes"></button>
        <button class="tb" id="tIdx" data-i18n="faceIdx"></button>
        <button class="tb" id="tSpin" data-i18n="spin"></button>
        <label class="slider"><span data-i18n="opacity"></span> <input type="range" id="opacity" min="0.15" max="1" step="0.01" value="0.55"></label>
      </div>
    </div>
    <div class="canvaswrap" id="wrap">
      <div class="bigsym"><div class="s" id="bigS"></div><div class="n" id="bigN"></div></div>
      <div class="viewbtns">
        <button class="tb" id="vReset" data-i18n="std" data-i18n-title="stdTitle"></button>
        <button class="tb" data-look="a" data-i18n-title="alongA">‖ a</button>
        <button class="tb" data-look="b" data-i18n-title="alongB">‖ b</button>
        <button class="tb" data-look="c" data-i18n-title="alongC">‖ c</button>
      </div>
      <div class="hint" id="hint"></div>
      <div id="tip"></div>
      <div id="opmsg"></div>
    </div>
  </div>
  <aside>
    <div class="panel" id="pQuiz" hidden></div>
    <div class="panel" id="pClass"></div>
    <div class="panel" id="pElems"><h4 data-i18n="symElems"></h4><div class="elist" id="elist"></div>
      <div class="muted" style="margin-top:8px" data-i18n="opHint"></div></div>
    <div class="panel" id="pStereo">
      <div class="phead"><h4 style="display:flex;align-items:center;gap:7px"><span data-i18n="stereo"></span><button class="qhelp" id="stereoHelpBtn" aria-label="?">?</button></h4><label class="follow"><input type="checkbox" id="followView"> <span data-i18n="follow"></span></label></div>
      <div id="stereoHelp" class="helpbox" hidden></div>
      <svg id="stereo" viewBox="-1.18 -1.18 2.36 2.36"></svg>
      <div class="muted" id="stereoNote"></div>
    </div>
    <div class="panel" id="pForms"><h4 data-i18n="formsTitle"></h4><table class="forms" id="ftable"></table></div>
  </aside>
</section>
<footer data-i18n="footer"></footer>
<div id="ftip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const KK_DEFAULT_LANG = 'en';
// ===== Die 32 Kristallklassen mit Beispielkristallen =====
// gens: Erzeugende im ITA-Stil (direkter Raum, Standardaufstellung)
// forms: hkl (bei trigonal/hexagonal 3-indizig h k l, Anzeige als h k i l), d = relativer Zentralabstand
const HEXL = (a, c) => [a, a, c, 90, 90, 120];
const TETL = (a, c) => [a, a, c, 90, 90, 90];
const CUBL = [1, 1, 1, 90, 90, 90];

const CLASSES = [
  // ---------------- triklin ----------------
  { id: '1', hm: '1', full: '1', sch: 'C<sub>1</sub>', name: 'triklin-pedial', system: 'triklin', gens: [],
    examples: [{ name: 'Idealisiert (z. B. Parahilgardit)', note: '',
      lat: [7.0, 8.0, 6.5, 100, 105, 80],
      forms: [
        { hkl: [1, 0, 0], d: 0.9, name: 'Pedion' }, { hkl: [-1, 0, 0], d: 1.15, name: 'Pedion' },
        { hkl: [0, 1, 0], d: 1.0, name: 'Pedion' }, { hkl: [0, -1, 0], d: 1.3, name: 'Pedion' },
        { hkl: [0, 0, 1], d: 1.05, name: 'Pedion' }, { hkl: [0, 0, -1], d: 0.95, name: 'Pedion' },
        { hkl: [1, 1, 0], d: 1.2, name: 'Pedion' }, { hkl: [-1, 1, 1], d: 1.3, name: 'Pedion' },
        { hkl: [1, -1, -1], d: 1.25, name: 'Pedion' }]
    }] },
  { id: '-1', hm: '-1', full: '-1', sch: 'C<sub>i</sub>', name: 'triklin-pinakoidal', system: 'triklin', gens: ['-x,-y,-z'],
    examples: [{ name: 'Chalkanthit', formula: 'CuSO<sub>4</sub>·5H<sub>2</sub>O', note: 'Kupfervitriol; alle Formen sind Pinakoide (Flächenpaare).',
      lat: [6.12, 10.69, 5.96, 97.6, 107.2, 77.5],
      forms: [
        { hkl: [1, 0, 0], d: 1.0, name: 'Pinakoid' }, { hkl: [0, 1, 0], d: 1.25, name: 'Pinakoid' },
        { hkl: [0, 0, 1], d: 1.0, name: 'Pinakoid' }, { hkl: [1, 1, 0], d: 1.3, name: 'Pinakoid' },
        { hkl: [1, -1, 0], d: 1.2, name: 'Pinakoid' }, { hkl: [1, 1, -1], d: 1.35, name: 'Pinakoid' }]
    }] },
  // ---------------- monoklin ----------------
  { id: '2', hm: '2', full: '121', sch: 'C<sub>2</sub>', name: 'monoklin-sphenoidisch', system: 'monoklin', gens: ['-x,y,-z'],
    examples: [{ name: 'Saccharose', formula: 'C<sub>12</sub>H<sub>22</sub>O<sub>11</sub>', note: 'Rohrzucker; polare b-Achse – die beiden Enden sind verschieden ausgebildet.',
      lat: [10.86, 8.70, 7.76, 90, 102.9, 90],
      forms: [
        { hkl: [1, 0, 0], d: 1.0, name: 'Pinakoid' }, { hkl: [0, 0, 1], d: 1.1, name: 'Pinakoid' },
        { hkl: [1, 1, 0], d: 1.25, name: 'Sphenoid' }, { hkl: [1, -1, 0], d: 1.12, name: 'Sphenoid' },
        { hkl: [0, 1, 0], d: 1.35, name: 'Pedion' }, { hkl: [0, 1, 1], d: 1.35, name: 'Sphenoid' }, { hkl: [1, 0, -1], d: 1.35, name: 'Pinakoid' }]
    }] },
  { id: 'm', hm: 'm', full: '1m1', sch: 'C<sub>s</sub>', name: 'monoklin-domatisch', system: 'monoklin', gens: ['x,-y,z'],
    examples: [{ name: 'Skolezit', formula: 'CaAl<sub>2</sub>Si<sub>3</sub>O<sub>10</sub>·3H<sub>2</sub>O', note: 'Zeolith; nur eine Spiegelebene, die c-Achse ist polar.',
      lat: [6.52, 18.96, 9.76, 90, 110.1, 90],
      forms: [
        { hkl: [0, 1, 0], d: 1.0, name: 'Pinakoid' }, { hkl: [1, 1, 0], d: 0.9, name: 'Doma' }, { hkl: [-1, 1, 0], d: 0.95, name: 'Doma' },
        { hkl: [1, 1, 1], d: 1.35, name: 'Doma' }, { hkl: [-1, 1, 1], d: 1.3, name: 'Doma' },
        { hkl: [0, 0, -1], d: 1.25, name: 'Pedion' }, { hkl: [1, 1, -1], d: 1.3, name: 'Doma' }]
    }] },
  { id: '2/m', hm: '2/m', full: '1 2/m 1', sch: 'C<sub>2h</sub>', name: 'monoklin-prismatisch', system: 'monoklin', gens: ['-x,y,-z', '-x,-y,-z'],
    examples: [
      { name: 'Orthoklas', formula: 'KAlSi<sub>3</sub>O<sub>8</sub>', note: 'Kalifeldspat, typische Tracht mit M{010}, T{110}, P{001} und y{-201}.',
        lat: [8.56, 12.96, 7.21, 90, 116.0, 90],
        forms: [{ hkl: [0, 1, 0], d: 1.0, name: 'Pinakoid' }, { hkl: [1, 1, 0], d: 1.15, name: 'Prisma' },
          { hkl: [0, 0, 1], d: 1.3, name: 'Pinakoid' }, { hkl: [-2, 0, 1], d: 1.3, name: 'Pinakoid' }] },
      { name: 'Gips', view: [62, 15], formula: 'CaSO<sub>4</sub>·2H<sub>2</sub>O', note: 'Tafelig nach {010}, mit Prisma {120} und Prisma {-111}.',
        lat: [6.28, 15.20, 5.67, 90, 114.1, 90],
        forms: [{ hkl: [0, 1, 0], d: 0.62, name: 'Pinakoid' }, { hkl: [1, 2, 0], d: 1.0, name: 'Prisma' },
          { hkl: [-1, 1, 1], d: 1.6, name: 'Prisma' }] }
    ] },
  // ---------------- orthorhombisch ----------------
  { id: '222', hm: '222', full: '222', sch: 'D<sub>2</sub>', name: 'rhombisch-disphenoidisch', system: 'orthorhombisch', gens: ['-x,-y,z', '-x,y,-z'],
    examples: [{ name: 'Epsomit', formula: 'MgSO<sub>4</sub>·7H<sub>2</sub>O', note: 'Bittersalz; Prisma {110} mit rhombischem Disphenoid {111}.',
      lat: [11.86, 11.99, 6.86, 90, 90, 90],
      forms: [{ hkl: [1, 1, 0], d: 1.0, name: 'rhomb. Prisma' }, { hkl: [1, 1, 1], d: 1.2, name: 'rhomb. Disphenoid' },
        { hkl: [1, -1, 1], d: 1.45, name: 'rhomb. Disphenoid' }]

I18N.formDef = (de, lang) => {
  const m = de.match(/^(.*) 3\. Stellung$/);
  const base = m ? m[1] : de, d = I18N.formDefs[base];
  if (!d) return '';
  return d[lang] + (m ? '<br><br>' + I18N.formDefs.__3rd[lang] : '');
};

I18N.stereoHelp = {
  de: { t: 'Was ist ein Flächenpol?', s: ['Man denkt sich den Kristall im Mittelpunkt einer großen Kugel.', 'Auf jeder Fläche errichtet man die Senkrechte (Flächennormale). Wo sie die Kugel durchstößt, liegt der <b>Flächenpol P</b>.', 'P wird mit dem Südpol S verbunden; der Schnittpunkt <b>P′</b> mit der Äquatorebene ist der Punkt im Stereogramm (●). Pole der unteren Halbkugel projiziert man zum Nordpol (○).'],

    m: '<b>Spiegelebenen als Großkreise:</b> Jede Spiegelebene geht durch den Kristallmittelpunkt und schneidet die Kugel in einem Großkreis. Im Stereogramm erscheint er als Durchmesser (Ebene enthält c), als Grundkreis (Ebene ⊥ c, dick und mit <i>m</i> markiert) oder als Kreisbogen zwischen zwei gegenüberliegenden Randpunkten (geneigte Ebene).',
    l: { P: 'Pol', S: 'Südpol', E: 'Äquatorebene' } },

    r: '<b>Rules of thumb:</b> pole at the centre = horizontal face; pole on the primitive circle = vertical face (e.g. a prism); the steeper the face, the further out its pole. Face size and shape do not matter – only the orientation. That is why the pole pattern shows the symmetry undistorted.',
    m: '<b>Mirror planes as great circles:</b> every mirror plane passes through the centre of the crystal and cuts the sphere in a great circle. In the stereogram it appears as a diameter (plane contains c), as the primitive circle (plane ⊥ c, drawn thick and marked <i>m</i>) or as an arc between two opposite points of the primitive (inclined plane).',
    l: { P: 'pole', S: 'south pole', E: 'equatorial plane' } },
  fr: { t: 'Qu’est-ce qu’un pôle de face ?', s: ['On imagine le cristal au centre d’une grande sphère.', 'Sur chaque face, on élève la perpendiculaire (normale à la face). Là où elle perce la sphère se trouve le <b>pôle P</b> de la face.', 'On relie P au pôle sud S ; l’intersection <b>P′</b> avec le plan équatorial est le point du stéréogramme (●). Les pôles de l’hémisphère inférieur sont projetés vers le pôle nord (○).'],
    r: '<b>Repères :</b> pôle au centre = face horizontale ; pôle sur le cercle primitif = face verticale (p. ex. un prisme) ; plus la face est raide, plus son pôle est à l’extérieur. Taille et forme des faces n’interviennent pas – seule leur orientation compte. C’est pourquoi la figure des pôles montre la symétrie sans distorsion.',
    m: '<b>Plans miroirs et grands cercles :</b> tout plan miroir passe par le centre du cristal et coupe la sphère selon un grand cercle. Dans le stéréogramme, celui-ci apparaît comme un diamètre (plan contenant c), comme le cercle primitif (plan ⊥ c, tracé épais et marqué <i>m</i>) ou comme un arc reliant deux points opposés du cercle primitif (plan incliné).',
    l: { P: 'pôle', S: 'pôle sud', E: 'plan équatorial' } },
  es: { t: '¿Qué es un polo de cara?', s: ['Se imagina el cristal en el centro de una gran esfera.', 'Sobre cada cara se levanta la perpendicular (normal a la cara). Donde atraviesa la esfera se encuentra el <b>polo P</b> de la cara.', 'Se une P con el polo sur S; la intersección <b>P′</b> con el plano ecuatorial es el punto del estereograma (●). Los polos del hemisferio inferior se proyectan hacia el polo norte (○).'],
    r: '<b>Reglas prácticas:</b> polo en el centro = cara horizontal; polo en el círculo primitivo = cara vertical (p. ej. un prisma); cuanto más inclinada la cara, más afuera su polo. El tamaño y la forma de las caras no importan, solo su orientación. Por eso el patrón de polos muestra la simetría sin distorsión.',
    m: '<b>Planos de reflexión como círculos máximos:</b> todo plano de reflexión pasa por el centro del cristal y corta la esfera en un círculo máximo. En el estereograma aparece como un diámetro (plano que contiene c), como el círculo primitivo (plano ⊥ c, grueso y marcado con <i>m</i>) o como un arco entre dos puntos opuestos del círculo primitivo (plano inclinado).',
    l: { P: 'polo', S: 'polo sur', E: 'plano ecuatorial' } }

// ===== Kristallklassen: Geometrie- und Symmetrie-Kern (ohne DOM) =====
const CORE = (() => {
  // ---------- lineare Algebra ----------
  const mul = (A, B) => A.map((r, i) => [0, 1, 2].map(j => A[i][0] * B[0][j] + A[i][1] * B[1][j] + A[i][2] * B[2][j]));
  const mv = (A, v) => A.map(r => r[0] * v[0] + r[1] * v[1] + r[2] * v[2]);
  const vm = (v, A) => [0, 1, 2].map(j => v[0] * A[0][j] + v[1] * A[1][j] + v[2] * A[2][j]);
  const tr = A => [0, 1, 2].map(i => [0, 1, 2].map(j => A[j][i]));
  const det = A => A[0][0] * (A[1][1] * A[2][2] - A[1][2] * A[2][1]) - A[0][1] * (A[1][0] * A[2][2] - A[1][2] * A[2][0]) + A[0][2] * (A[1][0] * A[2][1] - A[1][1] * A[2][0]);
  const inv = A => {
    const d = det(A);
    const c = (i, j) => {
      const m = [0, 1, 2].filter(x => x !== i), n = [0, 1, 2].filter(x => x !== j);
      return ((i + j) % 2 ? -1 : 1) * (A[m[0]][n[0]] * A[m[1]][n[1]] - A[m[0]][n[1]] * A[m[1]][n[0]]);
    };
    return [0, 1, 2].map(i => [0, 1, 2].map(j => c(j, i) / d));
  };
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const sc = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
  const len = a => Math.hypot(a[0], a[1], a[2]);
  const nrm = a => sc(a, 1 / len(a));

  // ---------- Symmetrieoperationen im ITA-Stil ("-y,x-y,z") ----------
  function parseOp(s) {
    return s.split(',').map(t => {
      const v = [0, 0, 0], re = /([+-]?)(\d*)([xyz])/g;
      let m;
      while ((m = re.exec(t.trim()))) v['xyz'.indexOf(m[3])] += (m[1] === '-' ? -1 : 1) * (m[2] ? +m[2] : 1);
      return v;
    });

    el.querySelectorAll('.qb').forEach(b => b.onclick = () => answer(b.dataset.id));
    const rv = el.querySelector('#qReveal'); if (rv) rv.onclick = () => { quiz.revealed = true; solve(false); };
    el.querySelector('#qNext').onclick = nextQuiz;
  }
  function answer(id) {
    if (quiz.solved) return;
    if (id === quiz.entry.c.id) { solve(true); return; }
    quiz.attempts++; quiz.wrong.add(id);
    quizFb = { cls: 'no', html: t('qWrong') + (quiz.attempts >= 2 ? ' ' + t('qHint', { s: trSys(quiz.entry.c.system) }) : '') };
    renderQuiz();
  }
  function solve(byAnswer) {
    const e = quiz.entry;
    quiz.solved = true;
    if (byAnswer && quiz.attempts === 0) quiz.score++;
    const sol = t('qSolved', { c: hmHTML(e.c.hm), n: trClass(e.c) });
    quizFb = byAnswer ? { cls: 'ok', html: t('qRight') + ' ' + sol } : { cls: '', html: sol };
    applyQuizUI();
    state.X.sym.fams.forEach((f, i) => setFam(i, true));
    renderQuiz();
  }
  function applyQuizUI() {
    const hide = quiz.on && !quiz.solved;
    ['pClass', 'pElems', 'pForms'].forEach(id => document.getElementById(id).hidden = hide);
    document.getElementById('pQuiz').hidden = !quiz.on;
    syncKindButtons();
    if (hide) document.querySelectorAll('[data-kind]').forEach(b => { b.disabled = true; b.classList.remove('on'); });
    document.getElementById('tAxes').disabled = hide;
    document.getElementById('tIdx').disabled = hide;
    if (hide) document.getElementById('tLabels').disabled = true;
    axesG.visible = state.showAxes && !hide;
    document.querySelectorAll('[data-look]').forEach(b => b.hidden = hide);
    renderClass(); stereoDirty = true;
  }

  // ---------- Auswahl ----------
  function select(e, userAction) {
    const prevKinds = state.X ? new Set(state.X.sym.fams.filter((f, i) => state.famVis[i]).map(f => f.kind)) : new Set(['rot', 'rotoinv', 'mirror', 'inv']);
    state.entry = e; state.X = getX(e); state.marked = -1; state.opIdx = {};
    opAnim = null; crystalG.matrix.identity(); ghostG.visible = false;
    // Sichtbarkeit nach Typ übernehmen
    state.famVis = state.X.sym.fams.map(f => quiz.on && !quiz.solved ? false : prevKinds.has(f.kind));
    cardEls.forEach((b, k) => b.classList.toggle('active', k === e));
    buildCrystal(); buildElements(); buildAxes();
    renderClass(); renderElements(); renderForms(); syncKindButtons();
    root.quaternion.copy(qDefault()); viewAnim = null;
    applyQuizUI(); if (quiz.on) renderQuiz();
    stereoDirty = true;
    if (!quiz.on) { try { history.replaceState(null, '', '#' + e.slug); } catch (_) { try { location.hash = e.slug; } catch (__) {} } }
    if (userAction) {
      const r = document.getElementById('stage').getBoundingClientRect();
      if (r.top > window.innerHeight * 0.55) document.getElementById('stage').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }
  window.addEventListener('keydown', ev => {
    if (ev.target.tagName === 'INPUT' || quiz.on) return;
    const i = ENTRIES.indexOf(state.entry);
    if (ev.key === 'ArrowRight') select(ENTRIES[(i + 1) % ENTRIES.length]);
    if (ev.key === 'ArrowLeft') select(ENTRIES[(i - 1 + ENTRIES.length) % ENTRIES.length]);
  });
  window.addEventListener('hashchange', () => { const e = ENTRIES.find(x => '#' + x.slug === location.hash); if (e && e !== state.entry) select(e); });

  const start = ENTRIES.find(x => '#' + x.slug === location.hash) || ENTRIES.find(x => x.c.id === '32');
  resize();
  applyStatic(); renderGallery(); renderStereoNote();
  select(start);
  requestAnimationFrame(frame);
  window.__KK = { state, select, ENTRIES, runOp, setFam, setLang, quiz, startQuiz, answer };
})();

</script>
